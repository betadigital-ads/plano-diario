<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plano Diário – Pré-visualização</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #0D1B2A; --deep: #1B263B; --sand: #D4C4A8; --cream: #F4F1DE; --sage: #778D7A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Host Grotesk", system-ui, sans-serif;
      background: var(--ink) url("fundo-aurora.jpg") center / cover fixed;
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body::before { content: ""; position: fixed; inset: 0; background: rgba(13, 27, 42, 0.78); z-index: 0; }
    .bar {
      position: relative; z-index: 1;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: rgba(13, 27, 42, 0.6);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(244, 241, 222, 0.16);
    }
    .bar h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
    .switch { display: inline-flex; padding: 4px; border-radius: 999px; background: rgba(244, 241, 222, 0.12); }
    .switch button {
      border: 0; background: transparent; color: var(--cream);
      font: 700 0.9rem "Host Grotesk", system-ui, sans-serif;
      padding: 9px 20px; border-radius: 999px; cursor: pointer;
      transition: background 0.25s, color 0.25s;
    }
    .switch button[aria-pressed="true"] { background: var(--sand); color: var(--ink); }
    .switch button:focus-visible, .open:focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; }
    .open { color: var(--sand); font-weight: 700; font-size: 0.9rem; text-decoration: none; }
    .stage { position: relative; z-index: 1; flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
    .frame {
      width: 100%; height: calc(100vh - 100px); min-height: 520px;
      border: 1px solid rgba(244, 241, 222, 0.2); border-radius: 18px; overflow: hidden; background: var(--ink);
      transition: width 0.5s cubic-bezier(.2, .7, .2, 1), border-radius 0.5s, padding 0.5s;
    }
    .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    body.mobile .frame {
      width: 390px; max-width: 100%; height: min(844px, calc(100vh - 100px));
      border-radius: 44px; border: 10px solid #0a121c; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="bar">
    <h1>Plano Diário</h1>
    <div class="switch" role="group" aria-label="Tamanho do ecrã">
      <button type="button" id="b-desktop" aria-pressed="true">Desktop</button>
      <button type="button" id="b-mobile" aria-pressed="false">Mobile</button>
    </div>
    <a class="open" href="index.html" target="_blank" rel="noopener">Abrir a página</a>
  </div>
  <div class="stage">
    <div class="frame"><iframe src="index.html" title="Plano Diário"></iframe></div>
  </div>
  <script>
    const bD = document.getElementById("b-desktop");
    const bM = document.getElementById("b-mobile");
    function setView(v) {
      const mobile = v === "mobile";
      document.body.classList.toggle("mobile", mobile);
      bM.setAttribute("aria-pressed", String(mobile));
      bD.setAttribute("aria-pressed", String(!mobile));
      try { history.replaceState(null, "", "?v=" + (mobile ? "mobile" : "desktop")); } catch (e) {}
    }
    bD.addEventListener("click", () => setView("desktop"));
    bM.addEventListener("click", () => setView("mobile"));
    setView(new URLSearchParams(location.search).get("v") === "mobile" ? "mobile" : "desktop");
  </script>
</body>
</html>
